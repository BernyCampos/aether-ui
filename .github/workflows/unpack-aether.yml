name: Stage Aether Atmosphere v0.4.0
on:
  push:
    branches:
      - release/aether-atmosphere-v0.4.0
    paths:
      - .aether-deploy.tar.gz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-verified-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract Aether production source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import tarfile

          archive = Path('.aether-deploy.tar.gz')
          expected_hash = '427c233b4838f9c5c91bf644aebce2628db45b29456722c6c03eb8a540e6dedc'
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected_hash
          allowed = {
              'CHANGELOG.md', 'README.md',
              'docs/ARCHITECTURE.md', 'docs/COMPATIBILITY.md',
              'docs/MARKETPLACE.md', 'docs/RELEASE.md',
              'docs/SCREENSHOTS.md', 'docs/TESTING.md',
              'docs/screenshots/aether-console.webp',
              'docs/screenshots/aether-files.webp',
              'docs/screenshots/aether-servers.webp',
              'docs/screenshots/aether-settings.webp',
              'lang/en/ui.php', 'lang/es/ui.php',
              'package.json', 'plugin.json', 'presets/atmosphere.json',
              'resources/css/aether.css',
              'resources/images/aether-atmosphere.webp',
              'resources/js/aether.js', 'resources/settings.schema.json',
              'resources/views/head.blade.php', 'src/Theme.php',
              'tests/theme-switcher.test.cjs', 'tools/package.py',
          }
          with tarfile.open(archive, 'r:gz') as tar:
              members = tar.getmembers()
              assert {m.name for m in members} == allowed, "Unexpected manifest"
              for member in members:
                  assert member.isfile() and 0 <= member.size < 1_000_000
                  path = Path(member.name)
                  assert not path.is_absolute() and '..' not in path.parts
                  if path.exists():
                      assert not path.is_symlink(), "Refusing to overwrite symlink"
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(tar.extractfile(member).read())
          archive.unlink()
          Path('.github/workflows/unpack-aether.yml').unlink()
          PY
      - name: Commit verified code and screenshots to release branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new changes."
            exit 0
          fi
          git commit -m "feat: Aether UI 0.4.0 Atmosphere production and real screenshots"
          git push origin HEAD:release/aether-atmosphere-v0.4.0
